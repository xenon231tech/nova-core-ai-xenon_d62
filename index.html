<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Nova Core AI</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #0a0f2a, #1a1a3e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }
        h1 { text-align: center; }
        .badge {
            text-align: center;
            margin: 15px 0;
        }
        .badge span {
            background: #00c853;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 0 5px;
        }
        .tee { background: #ff6d00 !important; }
        .chat {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
        }
        .msg-user { text-align: right; margin-bottom: 10px; }
        .msg-agent { text-align: left; margin-bottom: 10px; }
        .bubble {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
        }
        .msg-user .bubble { background: #00d2ff; }
        .msg-agent .bubble { background: rgba(255,255,255,0.2); }
        .input-area { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 25px;
            color: white;
        }
        button {
            padding: 12px 20px;
            background: #00d2ff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .footer {
            font-size: 11px;
            text-align: center;
            margin-top: 15px;
            color: #aaa;
        }
        .footer a { color: #00d2ff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Nova Core AI</h1>
        <div class="badge">
            <span>✅ Active</span>
            <span class="tee">🔒 TEE Active</span>
            <span>🤖 ID: 20762</span>
        </div>
        <div class="chat" id="chat">
            <div class="msg-agent"><div class="bubble">Halo! Saya Nova Core, AI agent Billions TEE. Coba tanya sesuatu!</div></div>
        </div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Tanya..." onkeypress="if(event.key==='Enter') kirim()">
            <button onclick="kirim()">Kirim</button>
        </div>
        <div class="footer">
            ✅ Diverifikasi Nova Core (Billions TEE) | 
            <a href="https://8004scan.io/agents/billions/20762" target="_blank">Agent Profile</a>
        </div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? 'msg-user' : 'msg-agent';
            div.innerHTML = `<div class="bubble">${text}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function kirim() {
            const pesan = input.value.trim();
            if (!pesan) return;
            addMessage(pesan, true);
            input.value = '';
            
            setTimeout(() => {
                addMessage("Maaf, API backend belum aktif. Deploy ke Vercel dulu ya! ✅ TEE tetap aktif.", false);
            }, 500);
        }
    </script>
</body>
</html>
